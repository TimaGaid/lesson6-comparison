<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Порівняння можливостей трьох тарифних планів.">
    <title>Порівняння тарифів</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="container">
        <h1>Порівняння тарифів</h1>
        <table>
            <caption>Можливості та вартість за місяць</caption>
            <thead>
                <tr>
                    <th scope="col">Можливості</th>
                    <th scope="col">Старт</th>
                    <th scope="col">Комфорт</th>
                    <th scope="col">Профі</th>
                </tr>
            </thead>
            <tbody>
                <tr><th scope="row">Ціна / місяць</th><td>99 грн</td><td>199 грн</td><td>299 грн</td></tr>
                <tr><th scope="row">Сховище</th><td>5 ГБ</td><td>25 ГБ</td><td>100 ГБ</td></tr>
                <tr><th scope="row">Проєкти</th><td>1</td><td>5</td><td>20</td></tr>
                <tr><th scope="row">Учасники</th><td>1</td><td>3</td><td>10</td></tr>
                <tr><th scope="row">Підтримка</th><td>Email</td><td>Чат</td><td>Чат і дзвінки</td></tr>
                <tr><th scope="row">Резервні копії</th><td>Щотижня</td><td>Щодня</td><td>Щодня</td></tr>
            </tbody>
        </table>
    </main>
</body>
</html>
